    <!-- Spotify Web Playback SDK: the callback MUST be defined before the
         script loads (the SDK calls it synchronously on ready), and we install
         an error handler so a CDN outage doesn't leave the app hanging on
         `window.__spotifySDKReady`. -->
    <link rel="dns-prefetch" href="https://sdk.scdn.co" />
    <link rel="preconnect" href="https://sdk.scdn.co" crossorigin />
    <script>
      window.__spotifySDKReadyPromiseResolvers = [];
      window.__spotifySDKLoadFailed = false;
      window.onSpotifyWebPlaybackSDKReady = function () {
        window.__spotifySDKReady = true;
        window.__spotifySDKReadyPromiseResolvers.forEach(function (resolve) { resolve(); });
        window.__spotifySDKReadyPromiseResolvers = [];
      };
    </script>
    <script
      id="spotify-player-sdk"
      src="https://sdk.scdn.co/spotify-player.js"
      async
      onerror="window.__spotifySDKLoadFailed = true; console.error('[Spotify] Web Playback SDK failed to load (CDN unreachable?)');"
    ></script>
